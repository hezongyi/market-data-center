name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to publish
        required: true

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "release requires a tag push or an explicit manual tag" >&2
            exit 1
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          git rev-parse "refs/tags/$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-list -n 1 "$tag")" >> "$GITHUB_OUTPUT"
      - name: Verify tag belongs to protected main
        shell: bash
        run: |
          git fetch --no-tags origin main
          commit="${{ steps.release.outputs.commit }}"
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "release tag commit $commit is not reachable from protected main" >&2
            exit 1
          }
      - name: Verify protected-main required check
        id: check
        shell: bash
        run: |
          commit="${{ steps.release.outputs.commit }}"
          check_json=""
          for attempt in {1..30}; do
            check_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$commit/check-runs" \
              --jq '.check_runs | map(select(.name == "verify" and .conclusion == "success")) | sort_by(.completed_at) | last' || true)
            if [[ -n "$check_json" && "$check_json" != "null" ]]; then
              break
            fi
            echo "waiting for commit-scoped verify ($attempt/30)"
            sleep 10
          done
          test -n "$check_json"
          test "$check_json" != "null"
          run_id=$(printf '%s' "$check_json" | jq -er '.details_url | capture("/runs/(?<id>[0-9]+)").id')
          url=$(printf '%s' "$check_json" | jq -er .details_url)
          test -n "$run_id"
          test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Generate release receipt
        run: |
          python scripts/write_release_receipt.py \
            --tag "${{ steps.release.outputs.tag }}" \
            --commit "${{ steps.release.outputs.commit }}" \
            --ci-run-id "${{ steps.check.outputs.run_id }}" \
            --ci-url "${{ steps.check.outputs.url }}" \
            --output release-receipt.json
      - name: Publish immutable GitHub release
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; immutable release left unchanged"
          else
            gh release create "$tag" --verify-tag --title "$tag" \
              --notes-file "docs/releases/$tag.md" release-receipt.json
          fi
