name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      base: ${{ steps.select.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch/manual run has no useful before SHA; keep the full gate.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE=HEAD; fi
          python scripts/ci_policy.py plan --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT"

  docs:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Documentation checks
        env:
          DATACENTER_PYTHON: python3
          DATACENTER_DOCS_BASE: ${{ needs.plan.outputs.base }}
        run: bash scripts/ci.sh docs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-receipts
          path: acceptance-receipts/ci/

  backend:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: backend-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/constraints/*.txt
      - run: python -m venv .venv
      - name: Install locked dependencies
        run: .venv/bin/python -m pip install -c backend/constraints/py$(echo '${{ matrix.python-version }}' | tr -d .).txt -e './backend[dev]'
      - name: Unified backend checks
        env:
          DATACENTER_PYTHON: .venv/bin/python
          DATACENTER_CI_RECEIPT: acceptance-receipts/ci/backend-${{ matrix.python-version }}.json
        run: bash scripts/ci.sh backend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-receipt-${{ matrix.python-version }}
          path: |
            acceptance-receipts/ci/backend-${{ matrix.python-version }}.json
            acceptance-receipts/operational-snapshot-benchmark.json

  web:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: web-node-22-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/constraints/py311.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -c backend/constraints/py311.txt -e './backend[dev]'
      - run: bash scripts/prepare-dev.sh web
      - run: npx --prefix webui playwright install --with-deps chromium
      - name: Unified Web and browser checks
        env:
          DATACENTER_PYTHON: .venv/bin/python
          DATACENTER_CI_RECEIPT: acceptance-receipts/ci/web.json
        run: bash scripts/ci.sh web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-receipts
          path: |
            acceptance-receipts/ci/web.json
            acceptance-receipts/browser/

  verify:
    name: verify
    if: always()
    needs: [plan, docs, backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Enforce required checks
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN: ${{ needs.plan.result }}
          DOCS: ${{ needs.docs.result }}
          BACKEND: ${{ needs.backend.result }}
          WEB: ${{ needs.web.result }}
        run: |
          python scripts/ci_policy.py verify --mode "$MODE" \
            --plan "$PLAN" --docs "$DOCS" --backend "$BACKEND" --web "$WEB"
