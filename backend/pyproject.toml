[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-center"
version = "0.6.2"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2", "pydantic-settings>=2", "requests>=2", "PySocks>=1.7.1", "polars>=1", "duckdb>=1.0", "pandas>=2", "yfinance==1.7.0", "curl_cffi==0.16.3", "dukascopy-python==4.0.1", "argon2-cffi>=23.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2", "ruff>=0.11", "tomli>=2; python_version < '3.11'"]

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated, use anyio\\.from_thread\\.BlockingPortal instead\\.:DeprecationWarning:starlette\\.testclient",
  # FastAPI builds FieldInfo(alias=<parameter name>) for every endpoint parameter and hands it to a
  # pydantic TypeAdapter; pydantic 2.13 reports the alias as ineffective in that internal usage.
  # Parameter binding itself is unaffected: OpenAPI keeps the real names and invalid values still fail
  # validation, which backend/tests/test_app_warning_contract.py asserts. Only this class is ignored so
  # every other warning keeps failing the gate. See issue #95.
  "ignore:The 'alias' attribute with value.*:pydantic.warnings.UnsupportedFieldAttributeWarning",
]
